
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OR</title>
    <link rel="stylesheet" href="stylesf.css">
</head>
<body>
    <div>
        <h1>Registrate en @livbedumb</h1>
        <p>Completa con tus datos para registrarte</p>

        <form action="#" method="POST" id="registroForm">
            <!-- Datos personales -->
            <fieldset>
                <legend>Datos Personales</legend>

                <div>
                    <label for="nombre">Nombre completo *</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Valentina Rosales" required>
                </div>

                <div>
                    <label for="email">Correo electrónico *</label>
                    <input type="email" id="email" name="email" placeholder="Ej: valentina.rosales.27@gmail.com" required>
                </div>

                <div>
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ej: +54 11 1234-5678">
                </div>

                <div>
                    <label for="fechaNacimiento">Fecha de nacimiento</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento">
                </div>

                <div>
                    <label for="user">Usuario*</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: @vanlen" required>
                </div>

                <div>
                    <label for="password">Contraseña *</label>
                    <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
                </div>

                <div>
                    <label for="confirmPassword">Confirmar contraseña *</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite tu contraseña" minlength="8" required>
                </div>

            </fieldset>

            <!-- Información adicional -->
            <fieldset>
                <legend>Información Adicional</legend>

                <div>
                    <label for="pais">País *</label>
                    <select id="pais" name="pais" required>
                        <option value="">Selecciona un país...</option>
                        <option value="AR">Argentina</option>
                        <option value="BO">Bolivia</option>
                        <option value="BR">Brasil</option>
                        <option value="CL">Chile</option>
                        <option value="CO">Colombia</option>
                        <option value="EC">Ecuador</option>
                        <option value="ES">España</option>
                        <option value="MX">México</option>
                        <option value="PE">Perú</option>
                        <option value="UY">Uruguay</option>
                        <option value="VE">Venezuela</option>
                        <option value="OTRO">Otro</option>
                    </select>
                </div>

                <div>
                    <label>Género</label>
                    <div>
                        <label>
                            <input type="radio" name="genero" value="masculino">
                            Masculino
                        </label>
                        <label>
                            <input type="radio" name="genero" value="femenino">
                            Femenino
                        </label>
                        <label>
                            <input type="radio" name="genero" value="otro">
                            Otro
                        </label>
                        <label>
                            <input type="radio" name="genero" value="noDeclarar" checked>
                            Prefiero no decirlo
                        </label>
                    </div>
                </div>

            <!-- Términos y condiciones -->
            <div>
                <label>
                    <input type="checkbox" name="terminos" required>
                    Acepto los <a href="#">términos y condiciones</a> *
                </label>
            </div>

            <!-- Botones -->
            <div>
        <a href="F2.html" class="boton-link">
    <button type="button">Registrarse</button>
</a>
                <button type="reset">Limpiar formulario</button>
            </div>
        </form>
    </div>
</body>
</html>
